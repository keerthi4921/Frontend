<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1 style="text-align: center;">Facebook</h1>
    <form action="">
        <h2 style="text-align: center;">Create a new account</h2>
        <p style="text-align: center;">
            It's quick and easy.
        </p>
        <hr>
        <input type="text" placeholder="First name" required>
        <input type="text" placeholder="Last name" required><br>
        <label>Age</label><br>
        <input type="age" placeholder="Age"><br>
        <label>Date of birth</label><br>
        <input type="date" placeholder="Date of birth"><br>
        <label for="gender">Gender</label>
        <br>
        <label for="female">Female</label>
        <input id="female" type="radio" name="gender" value="female">
        <label for="male">Male</label>
        <input  id="male"type="radio" name="gender" value="male">
        <label for="custom">Custom</label>
        <input id="custom" type="radio" name="gender" value="custom"><br>
        <LABEL>Email</LABEL><br>
        <input type="email" placeholder="Email Address" required><br>
        <label>Password</label><br>
        <input type="password" placeholder="Enter Password" required><br>
        <input type="checkbox" id="terms" required>
        <label for="terms">
            By clicking Sign Up, you agree to our Terms, Data Policy and Cookie Policy. You may receive SMS notifications from us and can opt out at any time.
        </label><br>
        <button style="background-color: #1877f2; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
            Sign up
        </button>



    </form>
    
</body>
</html>
